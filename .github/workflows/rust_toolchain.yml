# Weekly check for a new stable Rust. When the pin in rust-toolchain.toml is
# behind, the job fails — that failure is the notification to bump it. Bump by
# hand in a PR, so CI on that PR — not on unrelated PRs — is where new clippy
# lints surface. Rust ships stable every six weeks, so a weekly cadence catches
# a release within days.
#
# (The job only reports: Actions can't open PRs in this repo — the "Allow GitHub
# Actions to create and approve pull requests" setting is locked off — and a PR
# opened with GITHUB_TOKEN wouldn't trigger CI anyway.)
name: rust-toolchain

on:
  schedule:
    - cron: "17 9 * * 1" # Mondays 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check for a new stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: compare pinned vs. latest stable
        run: |
          pinned=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          latest=$(curl -fsSL https://static.rust-lang.org/dist/channel-rust-stable.toml \
            | sed -n '/^\[pkg.rust\]/,/^version/ s/^version = "\([0-9.]*\).*/\1/p')
          echo "pinned=$pinned latest=$latest"
          test -n "$latest" || { echo "could not determine latest stable"; exit 1; }
          if [ "$pinned" = "$latest" ]; then
            echo "up to date"
          else
            echo "::error file=rust-toolchain.toml::Rust $latest is the current stable; the pin is $pinned. Open a PR setting channel = \"$latest\" in rust-toolchain.toml (release notes: https://github.com/rust-lang/rust/blob/master/RELEASES.md)."
            exit 1
          fi
